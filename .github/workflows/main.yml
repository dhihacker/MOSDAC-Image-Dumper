
## ⚙️ Usage

### Manual Trigger
You can manually trigger a download from the GitHub Actions tab:
1. Go to **Actions** → **MOSDAC Image Downloader**
2. Click **Run workflow**
3. Choose options:
   - **download_all**: Download last 7 days (vs last 1 day)
   - **satellite**: Download specific satellite only

### Scheduled Runs
The workflow runs automatically every 30 minutes to fetch the latest images.

## 🔧 Configuration
Edit `config.yaml` to customize:
- Download frequency
- Storage organization
- Satellite/sensor filters
- Number of concurrent downloads

